base_image: kaspernj/tensorbuzz-base-ubuntu-26-04:latest

dependency_roots:
  - path: .
    package_manager: npm

builds:
  validate:
    name: Validate
    paths:
      - src/**
      - test/**
      - fixtures/**
      - package.json
      - package-lock.json
      - tsconfig.json
      - eslint.config.js
      - Dockerfile
      - compose.yml
      - compose.ci.yml
      - README.md
      - CHANGELOG.md
      - LICENSE
      - "!docs/**"
    script:
      - npm run validate
